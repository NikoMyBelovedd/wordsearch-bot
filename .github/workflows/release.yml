name: Release

# Publishing a release on GitHub attaches wordsearch-bot.zip to it: the bot's files
# in one folder, ready to unzip and run (README step 3 links to the latest one).

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the zip
        run: git archive --format=zip --prefix=wordsearch-bot/ -o wordsearch-bot.zip HEAD
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" wordsearch-bot.zip --clobber
