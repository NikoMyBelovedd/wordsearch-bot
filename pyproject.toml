[project]
name = "wsbot"
version = "0.1.0"
description = "Auto-solver for Word Search Explorer on Android (ADB) and iPhone (USB)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "uiautomator2>=3.2",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "pytesseract>=0.3.10",
    "textual>=0.80",
    "pymobiledevice3==11.19.4",
    "av>=18.1.0",
]

[project.scripts]
wsbot = "wsbot.cli:main"

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pytest>=9.1.1",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wsbot"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
