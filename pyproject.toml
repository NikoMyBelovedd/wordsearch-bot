[project]
name = "wsbot"
version = "0.1.0"
description = "ADB + OCR auto-solver for Word Search Explorer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "uiautomator2>=3.2",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "pytesseract>=0.3.10",
    "textual>=0.80",
]

[project.scripts]
wsbot = "wsbot.cli:main"

[dependency-groups]
dev = ["ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wsbot"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
