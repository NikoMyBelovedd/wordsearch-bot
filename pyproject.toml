[project]
name = "wsbot"
version = "1.2.1"
description = "Auto-solver for Word Search Explorer on Android (ADB) and iPhone (USB)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "uiautomator2==3.7.0",
    "opencv-python-headless==5.0.0.93",
    "numpy==2.4.6; python_version < '3.12'",  # 2.5 needs Python 3.12
    "numpy==2.5.3; python_version >= '3.12'",
    "pytesseract==0.3.13",
    "textual==8.2.8",
    "pymobiledevice3==11.19.4",
    "av==18.1.0",
]

[project.scripts]
wsbot = "wsbot.cli:main"

[dependency-groups]
dev = [
    "pillow==12.3.0",
    "pytest==9.1.1",
    "ruff==0.16.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wsbot"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
